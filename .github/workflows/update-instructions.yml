name: Update Copilot Instructions 🔄

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ... rest of your workflow steps remain the same
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies 📦
        run: npm ci || npm install

      - name: Generate New Instructions 🤖
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-instructions.mjs

      - name: Commit & Push Changes 🚀
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update copilot-instructions.md via Gemini [skip ci]"
          file_pattern: ".github/copilot-instructions.md"