    <text x="78" y="218" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.5">LEARNER</text>
    <rect x="78" y="230" width="250" height="48" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="96" y="261" fill="#334155" font-size="18">Alex</text><text x="298" y="260" fill="#64748b" font-size="18">⌄</text>
    <text x="366" y="218" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.5">GAME COMPANION</text>
    <g font-size="25" text-anchor="middle"><circle cx="397" cy="254" r="25" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="397" y="263">🤖</text><circle cx="460" cy="254" r="25" fill="#fff" stroke="#cbd5e1"/><text x="460" y="263">🦊</text><circle cx="523" cy="254" r="25" fill="#fff" stroke="#cbd5e1"/><text x="523" y="263">🦉</text><circle cx="586" cy="254" r="25" fill="#fff" stroke="#cbd5e1"/><text x="586" y="263">🦕</text></g>
    <rect x="820" y="231" width="126" height="46" rx="13" fill="#2f82c4"/><text x="883" y="260" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Save</text>

    <g transform="translate(54 338)">
      <g filter="url(#shadow)"><rect width="638" height="190" rx="22" fill="#fff" stroke="#dbe7e3"/></g><rect x="24" y="24" width="54" height="54" rx="15" fill="#dbeafe"/><text x="51" y="60" text-anchor="middle" font-size="27">🔢</text><text x="24" y="101" fill="#1d4ed8" font-size="12" font-weight="700" letter-spacing="1.2">NUMBER PLACE VALUES</text><text x="24" y="132" fill="#172c28" font-size="25" font-weight="700">Place Value Builder</text><text x="24" y="159" fill="#64748b" font-size="16">Move digits into the correct place across five levels.</text><text x="535" y="166" fill="#087f5b" font-size="16" font-weight="700">Play game →</text>
    </g>
    <g transform="translate(718 338)">
      <g filter="url(#shadow)"><rect width="668" height="190" rx="22" fill="#fff" stroke="#dbe7e3"/></g><rect x="24" y="24" width="54" height="54" rx="15" fill="#dcfce7"/><text x="51" y="60" text-anchor="middle" font-size="27">≡</text><text x="24" y="101" fill="#1d4ed8" font-size="12" font-weight="700" letter-spacing="1.2">UNDERSTAND NUMBER FORMS</text><text x="24" y="132" fill="#172c28" font-size="25" font-weight="700">Expanded Form Explorer</text><text x="24" y="159" fill="#64748b" font-size="16">Connect standard, expanded, and missing-number forms.</text><text x="565" y="166" fill="#087f5b" font-size="16" font-weight="700">Play game →</text>
    </g>
    <g transform="translate(54 556)">
      <g filter="url(#shadow)"><rect width="638" height="190" rx="22" fill="#fff" stroke="#dbe7e3"/></g><rect x="24" y="24" width="54" height="54" rx="15" fill="#fef3c7"/><text x="51" y="60" text-anchor="middle" font-size="27">🔍</text><text x="24" y="101" fill="#1d4ed8" font-size="12" font-weight="700" letter-spacing="1.2">VALUE OF A DIGIT</text><text x="24" y="132" fill="#172c28" font-size="25" font-weight="700">Digit Value Detective</text><text x="24" y="159" fill="#64748b" font-size="16">Find what a highlighted digit is worth.</text><text x="535" y="166" fill="#087f5b" font-size="16" font-weight="700">Play game →</text>
    </g>
    <g transform="translate(718 556)">
      <g filter="url(#shadow)"><rect width="668" height="190" rx="22" fill="#fff" stroke="#dbe7e3"/></g><rect x="24" y="24" width="54" height="54" rx="15" fill="#f3e8ff"/><text x="51" y="60" text-anchor="middle" font-size="27">🧩</text><text x="24" y="101" fill="#1d4ed8" font-size="12" font-weight="700" letter-spacing="1.2">REASON FROM CLUES</text><text x="24" y="132" fill="#172c28" font-size="25" font-weight="700">Place Value Clues</text><text x="24" y="159" fill="#64748b" font-size="16">Identify the only number that matches the clue.</text><text x="565" y="166" fill="#087f5b" font-size="16" font-weight="700">Play game →</text>
    </g>
