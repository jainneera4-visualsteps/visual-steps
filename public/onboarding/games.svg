<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Visual Steps adaptive place-value games</title>
  <desc id="desc">The Games page with a compact learner and companion selector and four place-value learning games.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f9ff"/><stop offset="1" stop-color="#f5fffb"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#64748b" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#page)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="54" fill="#2563eb" font-size="20">← Back to Dashboard</text>
    <text x="54" y="118" fill="#172c28" font-size="52" font-weight="500">Games</text>
    <text x="54" y="156" fill="#64748b" font-size="21">Choose a Visual Steps game for focused, enjoyable learning practice.</text>

